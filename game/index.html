<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NEON BAY — an original open-world crime game: 3.2 km² of neon streets, 6 story missions, hand-rolled WebGL 3D. Built for the make.fun gta6-01 bounty.">
<meta name="theme-color" content="#0a0e1e">
<title>NEON BAY — Open-World Crime</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e1e; }
  #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffd700; background: #0a0e1e; font: bold 28px sans-serif; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>
<div id="loading">NEON BAY — loading…</div>
<noscript>NEON BAY needs JavaScript to run.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
